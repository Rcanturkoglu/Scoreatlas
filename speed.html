<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ScoreAtlas snelheidstest</title>
<style>body{font:15px/1.5 -apple-system,Arial,sans-serif;background:#eaf3eb;color:#10241a;margin:0;padding:14px}h1{font-size:20px}.b{background:#16a34a;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;margin-right:6px}.c{background:#fff;border:1px solid #cfe0d1;border-radius:10px;padding:8px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:10px}.s{color:#dc2626;font-weight:700}.m{color:#d97706;font-weight:700}.f{color:#15803d;font-weight:700}small{color:#5d7263}</style></head><body>
<h1>ScoreAtlas · snelheidstest</h1><p>Tik één keer op Start en wacht tot onderaan <b>Klaar</b> staat. Dit duurt ongeveer 30 seconden. Laat Safari open staan.</p>
<button class="b" id="go">Start</button><button class="b" id="cp" style="background:#475569">Kopieer</button><div id="o"></div>
<script>
var API="https://api.scoreatlas.org",OLD="https://scoreatlas.64pkrb59jg.workers.dev",O=document.getElementById("o"),LOG=[];
function row(n,ms,x){var cl=ms>2000?"s":ms>800?"m":"f";O.insertAdjacentHTML("beforeend","<div class=c><span>"+n+(x?" <small>"+x+"</small>":"")+"</span><span class="+cl+">"+Math.round(ms)+" ms</span></div>");LOG.push(n+": "+Math.round(ms)+" ms"+(x?" ("+x+")":""))}
async function t(n,url){var a=performance.now(),st="";try{var r=await fetch(url);st="HTTP "+r.status;var tx=await r.text();if(/"errors":\s*\{[^}]/.test(tx))st+=" API-fout";else if(/"results":\s*0/.test(tx))st+=" leeg";else if(url.indexOf("/")>=0&&tx.length<60)st+=" "+tx.slice(0,20)}catch(e){st="fout "+e.message}row(n,performance.now()-a,st)}
async function run(){O.innerHTML="";LOG=[];
try{var h=await (await fetch("/index.html?z="+Date.now())).text();var a1=h.indexOf("data-share")>=0,a2=h.indexOf('API.key=="proxy"?undefined')>=0;O.insertAdjacentHTML("beforeend","<div class=c><span>Nieuwe site-versie online?</span><span class="+(a1&&a2?"f":"s")+">"+(a1&&a2?"ja":"NEE (oude index.html)")+"</span></div>");LOG.push("Nieuwe versie online: "+(a1&&a2))}catch(e){}
O.insertAdjacentHTML("beforeend","<h3>1. Alleen de server (geen API)</h3>");
await t("api.scoreatlas.org/ (1)",API+"/");await t("api.scoreatlas.org/ (2)",API+"/");await t("api.scoreatlas.org/ (3)",API+"/");
await t("workers.dev/ (oud adres)",OLD+"/");
O.insertAdjacentHTML("beforeend","<h3>2. Stand: eerste keer (koud) en tweede keer (uit cache)</h3>");
var L=[[207,"Zwitserland"],[218,"Oostenrijk"],[113,"Zweden"],[103,"Noorwegen"]];
for(var i=0;i<L.length;i++){var u=API+"/standings?league="+L[i][0]+"&season=2026";await t(L[i][1]+" koud",u);await t(L[i][1]+" cache",u)}
O.insertAdjacentHTML("beforeend","<h3>3. Team: laatste en volgende 5 wedstrijden</h3>");
var T=[[645,"Galatasaray"],[611,"Fenerbahçe"],[40,"Liverpool"]];
for(var j=0;j<T.length;j++){await t(T[j][1]+" last koud",API+"/fixtures?team="+T[j][0]+"&last=5");await t(T[j][1]+" last cache",API+"/fixtures?team="+T[j][0]+"&last=5");await t(T[j][1]+" next koud",API+"/fixtures?team="+T[j][0]+"&next=5")}
O.insertAdjacentHTML("beforeend","<div class=c><b>Klaar.</b> Tik op Kopieer en plak het hier.</div>");LOG.push("KLAAR")}
document.getElementById("go").onclick=run;
document.getElementById("cp").onclick=function(){var x=LOG.join("\n");(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(function(){alert("Gekopieerd")}).catch(function(){prompt("Kopieer dit:",x)})};
</script></body></html>
