<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ScoreAtlas controle</title>
<style>body{font:15px/1.5 -apple-system,Arial,sans-serif;background:#eaf3eb;color:#10241a;margin:0;padding:14px}h1{font-size:20px}.b{background:#16a34a;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;margin-right:6px}.c{background:#fff;border:1px solid #cfe0d1;border-radius:10px;padding:8px 12px;margin:6px 0;word-break:break-word}.ok{color:#15803d;font-weight:700}.bad{color:#dc2626;font-weight:700}small{color:#5d7263;display:block;font-family:monospace;font-size:12px}</style></head><body>
<h1>ScoreAtlas · controle</h1><p>Tik één keer op Start. Het duurt ongeveer 10 seconden. Daarna tik je op Kopieer en plak het hier.</p>
<button class="b" id="go">Start</button><button class="b" id="cp" style="background:#475569">Kopieer</button><div id="o"></div>
<script>
var O=document.getElementById("o"),LOG=[],B="https://api.scoreatlas.org";
function row(n,ok,x){O.insertAdjacentHTML("beforeend","<div class=c><span class="+(ok?"ok":"bad")+">"+(ok?"OK":"FOUT")+"</span> "+n+(x?"<small>"+x.replace(/</g,"&lt;")+"</small>":"")+"</div>");LOG.push((ok?"OK ":"FOUT ")+n+(x?" :: "+x:""))}
async function t(n,p){var a=performance.now();try{var r=await fetch(B+p),tx=await r.text(),ms=Math.round(performance.now()-a),er=/"errors":\s*(\{[^}]|\[[^\]])/.test(tx),res=(tx.match(/"results":\s*(\d+)/)||[])[1];row(n+" ("+ms+" ms, HTTP "+r.status+(res!=null?", "+res+" resultaten":"")+")",r.ok&&!er,(er||!r.ok)?tx.slice(0,300):"")}catch(e){row(n,false,"netwerkfout: "+e.message)}}
async function run(){O.innerHTML="";LOG=[];
O.insertAdjacentHTML("beforeend","<div class=c>Pagina: "+location.origin+"</div>");LOG.push("origin "+location.origin);
var d=new Date().toLocaleDateString("sv-SE");
await t("Server (/)","/");
await t("Wedstrijden van vandaag","/fixtures?date="+d);
await t("Competities","/leagues?current=true");
await t("Live","/fixtures?live=all");
await t("Stand Süper Lig","/standings?league=203&season=2026");
await t("Spelers zoeken","/players/profiles?search=ronaldo");
await t("Scheidsrechterlijst","/refs");
O.insertAdjacentHTML("beforeend","<div class=c><b>Klaar.</b> Tik op Kopieer.</div>");LOG.push("KLAAR")}
document.getElementById("go").onclick=run;
document.getElementById("cp").onclick=function(){var x=LOG.join("\n");(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(function(){alert("Gekopieerd")}).catch(function(){prompt("Kopieer dit:",x)})};
</script></body></html>
